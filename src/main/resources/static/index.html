<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOpsFlow</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>DevOpsFlow</h1><p>CI/CD & Container Deployment Platform</p></div><span>● LIVE</span></header><main><section class="hero"><div><h2>Deployment Command Center</h2><p>Build, test, containerize and track deployments.</p></div><div><button id="deploy">Deploy</button><button id="rollback" class="secondary">Rollback</button></div></section><section class="stats"><div class="card"><small>Application</small><b id="status">—</b></div><div class="card"><small>Version</small><b id="version">—</b></div><div class="card"><small>Build</small><b id="build">—</b></div><div class="card"><small>Docker</small><b id="docker">—</b></div></section><section class="panel"><div class="head"><h3>Pipeline</h3><strong id="pipe">—</strong></div><div id="pipeline" class="pipeline"></div></section><section class="panel"><div class="head"><h3>Deployment History</h3><button id="refresh" class="secondary">Refresh</button></div><div class="table"><table><thead><tr><th>Version</th><th>Commit</th><th>Status</th><th>Environment</th><th>Duration</th><th>Time</th></tr></thead><tbody id="history"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
